<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SB Intern Assessment POC</title>
    <!-- Import Sunbird inQuiry QuML Player asset files via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@project-sunbird/sunbird-quml-player-web-component@1.4.0/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@project-sunbird/sunbird-quml-player-web-component@1.4.0/sunbird-quml-player.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div id="loginScreen" class="container">

    <h2>Login</h2>

    <input
        type="text"
        id="loginPhone"
        placeholder="Phone Number">

    <br><br>

    <input
        type="password"
        id="loginPassword"
        placeholder="Password">

    <br><br>

    <button onclick="login()">
        Login
    </button>

    <br><br>

    <a href="#" onclick="showSignup()">
        Create Account
    </a>

</div>

<div id="signupScreen"
     class="container"
     style="display:none;">

    <h2>Create Account</h2>

    <input
        type="text"
        id="signupPhone"
        placeholder="Phone Number">

    <br><br>

    <input
        type="password"
        id="signupPassword"
        placeholder="Password">

    <br><br>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password">

    <br><br>

    <button onclick="register()">
        Register
    </button>

    <br><br>

    <a href="#" onclick="showLogin()">
        Back To Login
    </a>

</div>

<div id="quizScreen"
     class="container"
     style="display:none;">

<div id="quizScreen"
     class="container"
     style="display:none;">

    <h2>Intern Knowledge Check: Platform Engineering</h2>

    <select id="quizSelector">
        <option value="">Select Quiz</option>
        <option value="cloud_ops.json">
            Cloud Operations Basics
        </option>
        <option value="linux_basics.json">
            Linux Basics
        </option>
        <option value="database_basics.json">
            Database Basics
        </option>
        <option value="networking.json">
            Networking
        </option>
        <option value="sunbird_intro.json">
            Sunbird OS Basics
        </option>
    </select>

    <button onclick="loadQuiz()">
        Start Quiz
    </button>

    <hr>

    <div id="quiz"></div>

    <br>

    <button onclick="submitQuiz()">
        Submit Quiz
    </button>

    <div id="result"
         style="margin-top:20px;font-weight:bold;">
    </div>

</div>

    <hr>
    
    <div id="quiz"></div>

<br>

<button onclick="submitQuiz()">Submit Quiz</button>

<div id="result" style="margin-top:20px;font-weight:bold;"></div>
</div>

<script>
let quizData;

function showLogin() {

    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("signupScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "none";

}

function showSignup() {

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("signupScreen").style.display = "block";
    document.getElementById("quizScreen").style.display = "none";

}

function showQuizScreen() {

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("signupScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "block";

}

async function register() {

    const phone =
        document.getElementById("signupPhone").value;

    const password =
        document.getElementById("signupPassword").value;

    const confirm =
        document.getElementById("confirmPassword").value;

    if (password !== confirm) {

        alert("Passwords do not match");
        return;

    }

    const response = await fetch(
        "http://127.0.0.1:5000/register",
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                phone_number: phone,
                password: password
            })
        }
    );

    alert("Account Created");

    showLogin();

}

async function login() {

    const phone =
        document.getElementById("loginPhone").value;

    const password =
        document.getElementById("loginPassword").value;

    const response = await fetch(
        "http://127.0.0.1:5000/login",
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                phone_number: phone,
                password: password
            })
        }
    );

    const data = await response.json();

    if(data.success){

        localStorage.setItem(
            "userId",
            data.user_id
        );

        showQuizScreen();

    }
    else{

        alert("Invalid Login");

    }

}



function loadQuiz() {
  const file = document.getElementById("quizSelector").value;

  fetch(`./quizzes/${file}`)
    .then(res => res.json())
    .then(data => {
      quizData = data;

      document.getElementById("quiz").innerHTML = "";

      data.questions.forEach((q, index) => {
        let html = `
          <div style="margin-bottom:25px;">
            <h3>Q${index + 1}. ${q.body}</h3>
        `;

        q.options.forEach((opt, i) => {
          html += `
            <label>
              <input type="radio"
                     name="${q.id}"
                     value="${i}">
              ${opt}
            </label><br>
          `;
        });

        html += `</div>`;
        document.getElementById("quiz").innerHTML += html;
      });
    });
}



function submitQuiz() {

    console.log("Submit button clicked");
    alert("Submit function started");

  let score = 0;
  const answers = [];

  quizData.questions.forEach(q => {
    const selected = document.querySelector(
      `input[name="${q.id}"]:checked`
    );

    if (selected) {

      const selectedValue = parseInt(selected.value);

      answers.push({
        question_id: q.id,
        selected_answer: selectedValue,
        correct_answer: q.answer[0]
      });

      if (selectedValue === q.answer[0]) {
        score++;
      }
    }
  });

  document.getElementById('result').innerHTML =
    `Your Score: ${score} / ${quizData.questions.length}`;

console.log("Sending data to Flask...");

  fetch('http://127.0.0.1:5000/submit', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
    user_id: localStorage.getItem("userId"),
    quiz_id: quizData.id,
    quiz_name: quizData.name,
    score: score,
    total_questions: quizData.questions.length
    })
  })
  
  .then(response => response.json())
  .then(data => {
    console.log('Saved:', data);
    alert('Answers saved to PostgreSQL!');
  })
  .catch(error => {
    console.error("FULL ERROR:", error);
    alert("Could not save answers.");
});
}
</script>
</body>
</html>
